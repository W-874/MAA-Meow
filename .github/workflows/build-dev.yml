name: Build Dev APK

on:
  push:
    branches:
      - main
      - dev
      - refactor/background-task-layout
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      maa_repo:
        description: 'MAA Core GitHub repo (owner/repo)'
        required: false
        default: 'MaaAssistantArknights/MaaAssistantArknights'
      maa_tag:
        description: 'MAA Core release tag'
        required: false
        default: 'latest'

permissions:
  contents: read

concurrency:
  group: build-dev-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCR conversion deps
        run: python -m pip install -r scripts/requirements.txt

      - name: Download and deploy MAA Core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAA_REPO: ${{ inputs.maa_repo || 'MaaAssistantArknights/MaaAssistantArknights' }}
          MAA_TAG: ${{ inputs.maa_tag || 'latest' }}
        run: |
          TAG_ARG=""
          if [ -n "$MAA_TAG" ] && [ "$MAA_TAG" != "latest" ]; then
            TAG_ARG="--tag $MAA_TAG"
          fi
          REPO_ARG=""
          if [ -n "$MAA_REPO" ]; then
            REPO_ARG="--repo $MAA_REPO"
          fi
          python scripts/setup_maa_core.py --clean $TAG_ARG $REPO_ARG

      - name: Print MAA Resource version
        run: cat app/src/main/assets/MaaSync/MaaResource/version.json

      - name: Validate signing secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is not configured" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is not configured" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is not configured" >&2; exit 1; }

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.jks"

      - name: Test and build Debug APK
        env:
          KEYSTORE_PATH: ${{ github.event_name != 'pull_request' && format('{0}/release.jks', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK signature
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -x "$APKSIGNER" || { echo "apksigner not found" >&2; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaaNyan-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
